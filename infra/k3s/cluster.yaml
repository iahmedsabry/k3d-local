# yaml-language-server: $schema=https://raw.githubusercontent.com/k3d-io/k3d/main/pkg/config/v1alpha5/schema.json

apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: k3s-local

servers: 1
agents: 1

ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer

  - port: 8443:443
    nodeFilters:
      - loadbalancer

registries:
  create:
    name: k3s-local-registry
    host: "0.0.0.0"
    hostPort: "5001"

options:
  k3d:
    wait: true
    timeout: "120s"

  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
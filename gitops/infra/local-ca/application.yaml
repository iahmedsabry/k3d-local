apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-ca
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/iahmedsabry/k3d-local.git
    targetRevision: main
    path: gitops/infra/local-ca
    directory:
      include: '{local-ca-certificate.yaml,local-ca-issuer.yaml}'

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
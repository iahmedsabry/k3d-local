apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://github.com/iahmedsabry/k3d-local.git
      targetRevision: master
      path: charts/cert-manager
      helm:
        valueFiles:
          - $values/gitops/infra/cert-manager/values.yaml

    - repoURL: https://github.com/iahmedsabry/k3d-local.git
      targetRevision: master
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true